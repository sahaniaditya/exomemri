name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Ruff
        run: ruff check app scripts
      - name: OpenAPI schema is up to date
        env:
          SUPABASE_URL: https://ci.example.supabase.co
          SUPABASE_SERVICE_KEY: ci-placeholder-key
          GEMINI_API_KEY: ci-placeholder-key
          GEMINI_BASE_URL: https://generativelanguage.googleapis.com/v1beta/openai/
          GEMINI_MODEL_NAME: gemini-2.0-flash
        run: |
          python scripts/dump_openapi.py
          git diff --exit-code openapi.json
      - name: Tests
        run: pytest

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Generated types are up to date
        run: |
          npm run gen:types
          git diff --exit-code src/lib/types.ts
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test
      - name: Build
        run: npm run build
      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium
      - name: E2E (capture flow)
        run: npm run e2e
