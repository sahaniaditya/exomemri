[project]
name = "atlas-backend"
version = "0.1.0"
description = "Atlas Phase 0 capture endpoint"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["app", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "BLE"]
ignore = [
    "ANN401", # allow typing.Any where pragmatic
    "B008",   # Depends() in defaults is idiomatic FastAPI DI
]

[tool.ruff.lint.per-file-ignores]
"app/tests/*" = ["ANN"]
"scripts/*" = ["ANN"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["app/tests"]
addopts = "-q"
