<!doctype html>
<html>
  <head>
    <title>Cache invalidation strategies - ChatGPT</title>
  </head>
  <body>
    <main>
      <div data-message-author-role="user">
        <div class="text">What are common cache invalidation strategies?</div>
      </div>
      <div data-message-author-role="assistant">
        <div class="text">The main ones are TTL expiry, write-through, and write-back.</div>
      </div>
      <div data-message-author-role="user">
        <div class="text">When would I prefer write-back?</div>
      </div>
      <div data-message-author-role="assistant">
        <div class="text">Write-back suits write-heavy workloads where you batch flushes.</div>
      </div>
    </main>
  </body>
</html>
